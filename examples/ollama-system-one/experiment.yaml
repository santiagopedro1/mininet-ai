apiVersion: mininet-ai/v1alpha5
kind: Experiment
metadata:
  name: ollama-system-one
  description: Current-only switch diagnosis with a local Ollama decision model.
substrate:
  driver: fake
  topology:
    addressing:
      ipv4:
        subnet: 10.0.0.0/24
        strategy: sequential
      mac:
        prefix: 02:00:00
        strategy: sequential
    resources:
    - {name: network, kind: network}
    - name: h1
      kind: host
      parent: network
      interfaces:
      - {name: h1-eth0, ipv4: 10.0.0.1/24, mac: '02:00:00:00:00:01'}
    - name: h2
      kind: host
      parent: network
      interfaces:
      - {name: h2-eth0, ipv4: 10.0.0.2/24, mac: '02:00:00:00:00:02'}
    - name: s1
      kind: switch
      parent: network
      failMode: secure
      datapath: kernel
      protocols: [OpenFlow13]
      ports:
      - {name: s1-eth1, number: 1}
      - {name: s1-eth2, number: 2}
    links:
    - name: h1-s1
      endpoints: [{node: h1, adapter: h1-eth0}, {node: s1, adapter: s1-eth1}]
    - name: s1-h2
      endpoints: [{node: s1, adapter: s1-eth2}, {node: h2, adapter: h2-eth0}]
blueprints:
- apiVersion: mininet-ai/v1alpha5
  kind: AgentBlueprint
  metadata: {name: ollama-diagnosis}
  implementation: {type: declarative}
  execution: {kind: bounded-decision, scenario: switch-port-diagnosis}
  model:
    provider: ollama-systemone
    name: clef-flash:9b
    parameters:
      host: http://10.10.10.152:11434
      startupTimeout: 300s
      expectedIdentity:
        digest: 73e026ff389b28464bb26f8978f3164851a76832f0d339032747e2c56f98ea29
agents:
- name: diagnosis
  blueprint: ollama-diagnosis
  placement:
    layer: data
    targets: {kind: switch, names: [s1]}
    cardinality: per-target
    runtime: device-sidecar
  observe: [ovs.port-state]
  decisionInputs: {portState: ovs.port-state}
  triggers: [{type: interval, name: decision, every: 1s}]
  execution: {maxConcurrency: 1, overflow: coalesce, actionTimeout: 5s}
decisionScenarios:
- apiVersion: mininet-ai/v1alpha5
  kind: DecisionScenario
  metadata: {name: switch-port-diagnosis}
  inputMode: current-only
  instructions: >-
    Diagnose only the identified switch from its current local port states.
    Choose degraded if any reported port is down or if the port observation is
    unavailable. Choose healthy only when the observation is available and every
    reported port is up. Do not infer other switches, traffic, or network-wide
    reachability.
  choices:
  - id: healthy
    description: The current local port observation is available and every reported port is up.
    proposals: []
  - id: degraded
    description: A current local port is down or required current port evidence is unavailable.
    proposals: []
  paths: {}
  observations: {portState: ovs.port-state}
  timing: {cadence: 1s, decisionDeadline: 5s}
  policy: {}
