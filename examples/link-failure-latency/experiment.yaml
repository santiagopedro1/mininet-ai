apiVersion: mininet-ai/v1alpha3
kind: Experiment
metadata:
  name: link-failure-latency
  description: Detection, reasoning, and connectivity-recovery latency after a link failure.
  labels: {seed: "0"}

substrate:
  driver: mininet-ovs
  topology:
    resources:
      - {name: network, kind: network}
      - name: s8
        kind: switch
        parent: network
        controllers: []
        failMode: secure
        protocols: [OpenFlow13]
        ports:
          - {name: s8-eth1, number: 1}
          - {name: s8-eth2, number: 2}
          - {name: s8-eth3, number: 3}
      - name: s9
        kind: switch
        parent: network
        controllers: []
        failMode: secure
        protocols: [OpenFlow13]
        ports:
          - {name: s9-eth1, number: 1}
          - {name: s9-eth2, number: 2}
          - {name: s9-eth3, number: 3}
      - name: s2
        kind: switch
        parent: network
        controllers: []
        failMode: secure
        protocols: [OpenFlow13]
        ports:
          - {name: s2-eth1, number: 1}
          - {name: s2-eth2, number: 2}
      - name: s6
        kind: switch
        parent: network
        controllers: []
        failMode: secure
        protocols: [OpenFlow13]
        ports:
          - {name: s6-eth1, number: 1}
          - {name: s6-eth2, number: 2}
      - name: s4
        kind: switch
        parent: network
        controllers: []
        failMode: secure
        protocols: [OpenFlow13]
        ports:
          - {name: s4-eth1, number: 1}
          - {name: s4-eth2, number: 2}
      - name: s5
        kind: switch
        parent: network
        controllers: []
        failMode: secure
        protocols: [OpenFlow13]
        ports:
          - {name: s5-eth1, number: 1}
          - {name: s5-eth2, number: 2}
      - name: s3
        kind: switch
        parent: network
        controllers: []
        failMode: secure
        protocols: [OpenFlow13]
        ports:
          - {name: s3-eth1, number: 1}
          - {name: s3-eth2, number: 2}
      - name: s1
        kind: switch
        parent: network
        controllers: []
        failMode: secure
        protocols: [OpenFlow13]
        ports:
          - {name: s1-eth1, number: 1}
          - {name: s1-eth2, number: 2}
      - name: s10
        kind: switch
        parent: network
        controllers: []
        failMode: secure
        protocols: [OpenFlow13]
        ports:
          - {name: s10-eth1, number: 1}
          - {name: s10-eth2, number: 2}
      - name: s7
        kind: switch
        parent: network
        controllers: []
        failMode: secure
        protocols: [OpenFlow13]
        ports:
          - {name: s7-eth1, number: 1}
          - {name: s7-eth2, number: 2}
      - name: h1
        kind: host
        parent: network
        interfaces:
          - {name: h1-eth0, ipv4: 10.0.0.1/24, mac: "02:00:00:00:00:01"}
      - name: h2
        kind: host
        parent: network
        interfaces:
          - {name: h2-eth0, ipv4: 10.0.0.2/24, mac: "02:00:00:00:00:02"}
    # Seed-0 ring. The active h1-to-h2 link is s8-s9.
    links:
      - name: s8-s9
        endpoints: [{node: s8, adapter: s8-eth1}, {node: s9, adapter: s9-eth1}]
        bandwidth: 100
        delay: 1ms
      - name: s9-s2
        endpoints: [{node: s9, adapter: s9-eth2}, {node: s2, adapter: s2-eth1}]
        bandwidth: 100
        delay: 1ms
      - name: s2-s6
        endpoints: [{node: s2, adapter: s2-eth2}, {node: s6, adapter: s6-eth1}]
        bandwidth: 100
        delay: 1ms
      - name: s6-s4
        endpoints: [{node: s6, adapter: s6-eth2}, {node: s4, adapter: s4-eth1}]
        bandwidth: 100
        delay: 1ms
      - name: s4-s5
        endpoints: [{node: s4, adapter: s4-eth2}, {node: s5, adapter: s5-eth1}]
        bandwidth: 100
        delay: 1ms
      - name: s5-s3
        endpoints: [{node: s5, adapter: s5-eth2}, {node: s3, adapter: s3-eth1}]
        bandwidth: 100
        delay: 1ms
      - name: s3-s1
        endpoints: [{node: s3, adapter: s3-eth2}, {node: s1, adapter: s1-eth1}]
        bandwidth: 100
        delay: 1ms
      - name: s1-s10
        endpoints: [{node: s1, adapter: s1-eth2}, {node: s10, adapter: s10-eth1}]
        bandwidth: 100
        delay: 1ms
      - name: s10-s7
        endpoints: [{node: s10, adapter: s10-eth2}, {node: s7, adapter: s7-eth1}]
        bandwidth: 100
        delay: 1ms
      - name: s7-s8
        endpoints: [{node: s7, adapter: s7-eth2}, {node: s8, adapter: s8-eth2}]
        bandwidth: 100
        delay: 1ms
      - name: h1-s8
        endpoints: [{node: h1, adapter: h1-eth0}, {node: s8, adapter: s8-eth3}]
        bandwidth: 100
        delay: 1ms
      - name: h2-s9
        endpoints: [{node: h2, adapter: h2-eth0}, {node: s9, adapter: s9-eth3}]
        bandwidth: 100
        delay: 1ms

blueprints:
  - ./agent-blueprints/ollama-switch-router.yaml
capabilityDefinitions:
  - ./capabilities/openflow-flow-install.yaml

agents:
  - name: switch-router
    blueprint: ollama-switch-router
    placement:
      layer: data
      targets: {kind: switch}
      cardinality: per-target
      runtime: device-sidecar
    observe: [topology.neighbors, openflow.flows]
    capabilities: [openflow.flow.install]
    triggers:
      - {type: manual, name: failure-monitor}

coordination:
  mode: independent
policies:
  conflicting-actions: reject
  require-postcondition-check: false
resourceLimits:
  max-instances: 10
  max-concurrent-invocations: 10
  max-queued-events: 32
