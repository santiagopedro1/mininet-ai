apiVersion: mininet-ai/v1alpha3
kind: Capability
metadata:
  name: openflow.flow.install
  description: Install an explicit unicast or directed ARP forwarding rule.
targets: [switch]
layers: [data]
effects: [dataplane.write]
input-schema:
  type: object
  required: [priority, match, actions]
  properties:
    priority: {type: integer}
    match: {type: object}
    actions: {type: string, minLength: 1}
  additionalProperties: false
output-schema:
  type: object
provider: substrate.action
