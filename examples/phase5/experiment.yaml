apiVersion: mininet-ai/v1alpha2
kind: Experiment
metadata:
  name: phase5-centralized-coordination
  description: Centralized delegation with Mininet-owned conflict rejection.

substrate:
  driver: fake
  topology:
    resources:
      - {name: network, kind: network}
      - {name: s1, kind: switch, parent: network, labels: {role: managed}}

blueprints:
  - ./agent-blueprints/coordinator.yaml
  - ./agent-blueprints/remediator.yaml

capabilityDefinitions:
  - ./capabilities/install-flow.yaml

agents:
  - name: global-coordinator
    blueprint: coordinator
    placement:
      layer: global
      targets: {kind: network, names: [network]}
      cardinality: singleton
      runtime: orchestrator

  - name: primary-remediator
    blueprint: remediator
    placement:
      layer: data
      targets: {kind: switch, names: [s1]}
      cardinality: per-target
      runtime: device-sidecar
    capabilities: [openflow.flow.install]
    execution: {maxConcurrency: 1, queueCapacity: 4, overflow: reject}

  - name: secondary-remediator
    blueprint: remediator
    placement:
      layer: data
      targets: {kind: switch, names: [s1]}
      cardinality: per-target
      runtime: device-sidecar
    capabilities: [openflow.flow.install]
    execution: {maxConcurrency: 1, queueCapacity: 4, overflow: reject}

coordination:
  mode: centralized
  coordinator: global-coordinator

policies:
  conflicting-actions: reject
  require-postcondition-check: false

resourceLimits:
  max-instances: 4
  max-concurrent-invocations: 3
  max-queued-events: 16
