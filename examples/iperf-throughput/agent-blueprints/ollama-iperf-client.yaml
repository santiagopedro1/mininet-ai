apiVersion: mininet-ai/v1alpha2
kind: AgentBlueprint
metadata:
  name: ollama-iperf-client
  description: Ollama-backed host agent that runs an iperf v2 TCP test.
implementation:
  type: python
  entrypoint: mininet_ai.agents.agno.ollama_factory:create_prompt_parsed_agent
model:
  provider: ollama
  name: qwen3.5:latest
reasoning:
  instructions: |-
    Run one TCP throughput test from this host against the iperf server at
    10.0.0.12. You can only propose the host.process.start capability for
    target client. The managed process runs without a shell: command is the
    binary and arguments is a JSON array of plain strings, no pipes or
    redirection. This host has the iperf v2 binary (not iperf3), so use v2
    flags: "-c" selects the server address, "-t" sets seconds, "-f m" prints
    Mbit. The arguments array MUST equal
    ["-c", "10.0.0.12", "-t", "20", "-f", "m"] exactly.

    Return this exact structure, changing only the explanatory message if
    desired:
    {
      "message": "Running a 20s TCP throughput test against 10.0.0.12.",
      "proposals": [
        {
          "id": "run-iperf-client",
          "capability": "host.process.start",
          "target": "client",
          "arguments": {"command": "iperf", "arguments": ["-c", "10.0.0.12", "-t", "20", "-f", "m"]},
          "reason": "Measure TCP throughput client to server.",
          "timeoutSeconds": 30
        }
      ],
      "delegations": [],
      "sharedStateUpdates": [],
      "metadata": {}
    }
  timeout: 120s
memory:
  conversation:
    maxMessages: 10
    summaries: false
