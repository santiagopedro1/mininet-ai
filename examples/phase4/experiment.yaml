apiVersion: mininet-ai/v1alpha1
kind: Experiment
metadata:
  name: phase4-autonomous-runtime
  description: Telemetry-driven autonomous action with verified effects.

substrate:
  driver: fake
  topology:
    resources:
      - {name: network, kind: network}
      - {name: s1, kind: switch, parent: network, labels: {role: managed}}

blueprints:
  - ./agent-blueprints/congestion-controller.yaml

capabilityDefinitions:
  - ./capabilities/install-flow.yaml

agents:
  - name: congestion-controller
    blueprint: congestion-controller
    placement:
      layer: data
      targets: {kind: switch, names: [s1]}
      cardinality: per-target
      runtime: device-sidecar
    observe: [tc.queue-occupancy, openflow.flows]
    capabilities: [openflow.flow.install]
    triggers:
      - type: event
        name: congestion-alert
        event: queue.congested
        source: telemetry
        cooldown: 1s
    observationPolicies:
      - observation: tc.queue-occupancy
        every: 10ms
        window: 10ms
        aggregation: latest
        detectors:
          - type: threshold
            name: queue-high
            event: queue.congested
            path: queue.depth
            operator: gte
            value: 80
            cooldown: 1s
    execution:
      queueCapacity: 4
      maxConcurrency: 1
      overflow: coalesce
      actionTimeout: 2s
      restart: {policy: never, maxAttempts: 0}

coordination:
  mode: independent

policies:
  conflicting-actions: serialize
  require-postcondition-check: true

resourceLimits:
  max-instances: 4
  max-concurrent-invocations: 2
  max-queued-events: 32
