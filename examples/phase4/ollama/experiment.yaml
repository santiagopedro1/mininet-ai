apiVersion: mininet-ai/v1alpha2
kind: Experiment
metadata:
  name: phase4-ollama-acceptance
  description: Exercise persistent Agno sessions with a real Ollama model.

substrate:
  driver: fake
  topology:
    resources:
      - {name: network, kind: network}
      - {name: s1, kind: switch, parent: network, labels: {role: managed}}

blueprints:
  - ./agent-blueprints/congestion-controller.yaml

capabilityDefinitions:
  - ./capabilities/install-flow.yaml

agents:
  - name: congestion-controller
    blueprint: congestion-controller
    placement:
      layer: data
      targets: {kind: switch, names: [s1]}
      cardinality: per-target
      runtime: device-sidecar
    observe: [openflow.flows]
    capabilities: [openflow.flow.install]
    triggers:
      - type: manual
        name: operator
    execution:
      queueCapacity: 4
      maxConcurrency: 1
      overflow: reject
      actionTimeout: 30s
      restart: {policy: never, maxAttempts: 0}

coordination:
  mode: independent

policies:
  conflicting-actions: serialize
  require-postcondition-check: false

resourceLimits:
  max-instances: 2
  max-concurrent-invocations: 1
  max-queued-events: 8
