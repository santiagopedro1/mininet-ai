apiVersion: mininet-ai/v1alpha2
kind: Capability
metadata:
  name: openflow.flow.install
  description: Exercise the action path through the safe fake substrate.
targets: [switch]
layers: [data]
effects: [dataplane.write]
input-schema:
  type: object
  required: [match, actions]
  properties:
    match: {type: string}
    actions: {type: string}
  additionalProperties: false
output-schema:
  type: object
reversible: true
provider: fake.openflow
rollback:
  timeout: 5s
