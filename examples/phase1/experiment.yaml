apiVersion: mininet-ai/v1alpha1
kind: Experiment
metadata:
  name: multi-layer-placement
  description: Phase 1 acceptance experiment using one blueprint at four layers.

substrate:
  driver: fake
  topology:
    resources:
      - name: network
        kind: network
      - name: control-domain
        kind: controller-domain
        parent: network
      - name: s1
        kind: switch
        parent: control-domain
        labels: {role: edge, region: west}
      - name: s2
        kind: switch
        parent: control-domain
        labels: {role: edge, region: east}
      - name: h1
        kind: host
        parent: network
        labels: {role: client}
      - name: h2
        kind: host
        parent: network
        labels: {role: client}
    links:
      - name: h1-s1
        endpoints: [h1, s1]
      - name: s1-s2
        endpoints: [s1, s2]
      - name: s2-h2
        endpoints: [s2, h2]

blueprints:
  - ./agent-blueprints/local-router.yaml

capabilityDefinitions:
  - ./capabilities/openflow-flow-install.yaml

agents:
  - name: global-router
    blueprint: local-router
    placement:
      layer: global
      targets: {kind: network, names: [network]}
      cardinality: singleton
      runtime: orchestrator
    observe: [topology.resources]

  - name: control-router
    blueprint: local-router
    placement:
      layer: control
      targets: {kind: controller-domain}
      cardinality: per-target
      runtime: controller-sidecar
    observe: [topology.resources, controller.events]

  - name: switch-router
    blueprint: local-router
    placement:
      layer: data
      targets:
        kind: switch
        matchLabels: {role: edge}
      cardinality: per-target
      runtime: device-sidecar
    observe: [ovs.port-counters, tc.queue-occupancy, topology.neighbors]
    capabilities: [openflow.flow.install]

  - name: host-router
    blueprint: local-router
    placement:
      layer: host
      targets:
        kind: host
        matchLabels: {role: client}
      cardinality: per-target
      runtime: host-namespace
    observe: [host.interfaces]

coordination:
  mode: independent

policies:
  conflicting-actions: reject
  require-postcondition-check: true

resourceLimits:
  max-instances: 20
