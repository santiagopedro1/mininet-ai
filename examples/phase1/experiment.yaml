apiVersion: mininet-ai/v1alpha1
kind: Experiment
metadata:
  name: multi-layer-placement
  description: Phase 1 acceptance experiment using one blueprint at four layers.

substrate:
  driver: fake
  topology:
    addressing:
      ipv4:
        subnet: 10.0.0.0/24
        strategy: sequential
      mac:
        prefix: "02:00:00"
        strategy: sequential
    resources:
      - name: network
        kind: network
      - name: c0
        kind: controller
        parent: network
        type: builtin
        protocol: tcp
        port: 6653
      - name: control-domain
        kind: controller-domain
        parent: network
        controllers: [c0]
      - name: s1
        kind: switch
        parent: control-domain
        labels: {role: edge, region: west}
        failMode: secure
        datapath: kernel
        controllers: [c0]
        protocols: [OpenFlow13]
        ports:
          - {name: s1-eth1, number: 1}
          - {name: s1-eth2, number: 2}
      - name: s2
        kind: switch
        parent: control-domain
        labels: {role: edge, region: east}
        failMode: secure
        datapath: kernel
        controllers: [c0]
        protocols: [OpenFlow13]
        ports:
          - {name: s2-eth1, number: 1}
          - {name: s2-eth2, number: 2}
      - name: h1
        kind: host
        parent: network
        labels: {role: client}
        interfaces:
          - {name: h1-eth0, ipv4: auto, mac: auto, mtu: 1500}
      - name: h2
        kind: host
        parent: network
        labels: {role: client}
        interfaces:
          - {name: h2-eth0, ipv4: auto, mac: auto, mtu: 1500}
    links:
      - name: h1-s1
        endpoints:
          - {node: h1, adapter: h1-eth0}
          - {node: s1, adapter: s1-eth1}
        bandwidth: 100
        delay: 2ms
        loss: 0
        maxQueueSize: 1000
      - name: s1-s2
        endpoints:
          - {node: s1, adapter: s1-eth2}
          - {node: s2, adapter: s2-eth1}
        bandwidth: 1000
        delay: 1ms
        jitter: 100us
        loss: 0.1
      - name: s2-h2
        endpoints:
          - {node: s2, adapter: s2-eth2}
          - {node: h2, adapter: h2-eth0}
        bandwidth: 100
        delay: 2ms
        loss: 0

blueprints:
  - ./agent-blueprints/local-router.yaml

capabilityDefinitions:
  - ./capabilities/openflow-flow-install.yaml

agents:
  - name: global-router
    blueprint: local-router
    placement:
      layer: global
      targets: {kind: network, names: [network]}
      cardinality: singleton
      runtime: orchestrator
    observe: [topology.resources]

  - name: control-router
    blueprint: local-router
    placement:
      layer: control
      targets: {kind: controller-domain}
      cardinality: per-target
      runtime: controller-sidecar
    observe: [topology.resources, controller.events]

  - name: switch-router
    blueprint: local-router
    placement:
      layer: data
      targets:
        kind: switch
        matchLabels: {role: edge}
      cardinality: per-target
      runtime: device-sidecar
    observe: [ovs.port-counters, tc.queue-occupancy, topology.neighbors]
    capabilities: [openflow.flow.install]

  - name: host-router
    blueprint: local-router
    placement:
      layer: host
      targets:
        kind: host
        matchLabels: {role: client}
      cardinality: per-target
      runtime: host-namespace
    observe: [host.interfaces]

coordination:
  mode: independent

policies:
  conflicting-actions: reject
  require-postcondition-check: true

resourceLimits:
  max-instances: 20
