[project]
name = "mininet-ai"
version = "0.1.0"
description = "A declarative experiment compiler and runtime for agentic networks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"pydantic>=2.13.3",
	"pyyaml>=6.0.3",
	"rich>=15.0.0",
	"typer>=0.25.0",
]

[project.scripts]
mininet-ai = "mininet_ai.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["mininet_ai*"]
