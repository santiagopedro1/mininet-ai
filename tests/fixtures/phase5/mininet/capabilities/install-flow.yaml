apiVersion: mininet-ai/v1alpha2
kind: Capability
metadata:
  name: openflow.flow.install
  description: Install one forwarding rule on a live OVS switch.
targets: [switch]
layers: [data]
effects: [dataplane.write]
input-schema:
  type: object
  required: [match, actions]
  properties:
    match: {type: string}
    actions: {type: string}
  additionalProperties: false
output-schema: {type: object}
reversible: false
provider: substrate.action
