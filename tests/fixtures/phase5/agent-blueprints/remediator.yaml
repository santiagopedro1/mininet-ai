apiVersion: mininet-ai/v1alpha2
kind: AgentBlueprint
metadata:
  name: remediator
  description: Deterministic switch agent that proposes one forwarding repair.
implementation:
  type: declarative
model:
  provider: mock
  name: deterministic
  parameters:
    response:
      message: Propose the declared forwarding repair.
      proposals:
        - id: install-recovery-flow
          capability: openflow.flow.install
          target: s1
          arguments: {match: ip, actions: normal}
    usage: {inputTokens: 18, outputTokens: 12, totalTokens: 30}
reasoning:
  instructions: Use only the capability and target supplied in context.
  timeout: 2s
